name: Feature request
description: Suggest a change or an addition.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        The server is deliberately single user. Changes that loosen the
        account allowlist, the redirect URI matching or the PKCE requirement
        are out of scope — see CONTRIBUTING.md.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that does not work today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
      description: A rough sketch is fine. Alternatives you considered help too.
    validations:
      required: true

  - type: checkboxes
    id: willing
    attributes:
      label: Would you like to implement it?
      options:
        - label: I am willing to open a pull request for this.
